<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>YouTube Live Chat HUD</title>

  <style>
    body {
      background: #0a0a0a;
      color: #00ff88;
      font-family: monospace;
      padding: 20px;
    }

    input {
      padding: 10px;
      width: 300px;
      background: #111;
      color: #0f0;
      border: 1px solid #333;
    }

    button {
      padding: 10px;
      background: #00ff88;
      border: none;
      cursor: pointer;
      margin-left: 10px;
    }

    .chat {
      margin-top: 20px;
      max-width: 700px;
    }

    .msg {
      border-bottom: 1px solid #111;
      padding: 5px 0;
    }

    .author {
      color: white;
      font-weight: bold;
    }

    .time {
      color: #555;
      font-size: 12px;
      margin-left: 10px;
    }
  </style>
</head>

<body>

<h2>🎥 YouTube Live Chat HUD</h2>

<input id="videoId" placeholder="Enter Live Video ID">
<button onclick="connect()">Connect</button>

<div id="chat" class="chat"></div>

<script>
const chatBox = document.getElementById("chat");

let interval = null;

// =====================
// CONNECT
// =====================
async function connect() {
  const videoId = document.getElementById("videoId").value;

  await fetch("/connect", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ videoId })
  });

  startPolling();
}

// =====================
// LOAD CHAT
// =====================
async function loadChat() {
  try {
    const res = await fetch("/chat", {
      cache: "no-store"
    });

    const text = await res.text();
    const data = JSON.parse(text);

    chatBox.innerHTML = "";

    data.messages.reverse().forEach(msg => {
      const div = document.createElement("div");
      div.className = "msg";

      div.innerHTML = `
        <span class="author">${msg.author}</span>
        <span class="time">${msg.time}</span><br/>
        ${msg.text}
      `;

      chatBox.appendChild(div);
    });

  } catch (e) {
    console.error("LOAD ERROR:", e);
  }
}

// =====================
// POLLING
// =====================
function startPolling() {
  if (interval) clearInterval(interval);

  loadChat();
  interval = setInterval(loadChat, 2000);
}
</script>

</body>
</html>
